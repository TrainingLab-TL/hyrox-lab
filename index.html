<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HYROX LAB | HYROXトレーニングツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      font-size: 16px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 8px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>HYROX LAB</h1>
  <p>HYROXをもっと効率よく攻略するための無料ツール</p>
</header>

<main>

  <section class="card">
    <h2>🏃 HYROX ランペース計算</h2>

    <p>
      1kmのランニングペースを入力すると、
      8kmのランニング合計時間を計算します。
    </p>

    <label>
      1kmのペース（分）
    </label>

    <input
      type="number"
      id="pace"
      placeholder="例：5"
      min="1"
      max="15"
      step="0.1"
    >

    <button onclick="calculatePace()">
      計算する
    </button>

    <div id="result"></div>
  </section>

  <section class="card">
    <h2>🔢 1RM計算</h2>

    <p>
      トレーニング重量と回数から、
      推定1RMを計算できます。
    </p>

    <p>
      <strong>近日公開</strong>
    </p>
  </section>

  <section class="card">
    <h2>❤️ Zone 2計算</h2>

    <p>
      心拍数からZone 2トレーニングの目安を計算します。
    </p>

    <p>
      <strong>近日公開</strong>
    </p>
  </section>

</main>

<footer>
  © 2026 HYROX LAB
</footer>

<script>

function calculatePace() {

  const pace = parseFloat(
    document.getElementById("pace").value
  );

  const result =
    document.getElementById("result");

  if (!pace || pace <= 0) {

    result.style.display = "block";

    result.innerHTML =
      "1kmのペースを入力してください。";

    return;
  }

  const totalMinutes = pace * 8;

  const minutes =
    Math.floor(totalMinutes);

  const seconds =
    Math.round(
      (totalMinutes - minutes) * 60
    );

  result.style.display = "block";

  result.innerHTML =
    "<strong>8kmのランニング予想時間</strong><br><br>" +
    minutes + "分 " +
    seconds + "秒";

}

</script>

</body>
</html>
